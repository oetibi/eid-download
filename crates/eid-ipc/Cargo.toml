[package]
name = "eid-ipc"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
eid-platform = { path = "../eid-platform" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "test-util"] }

[lints]
workspace = true
