[package]
name = "eid-engine"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Crash/jitter injection used only by tests (EID_FAULT / EID_FAULT_AFTER env, set_jitter()).
test-faults = []

[dependencies]
eid-platform = { path = "../eid-platform" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = "0.7"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
percent-encoding = "2"
fastrand = "2"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls-alpn", "stream"] }
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
eid-testserver = { path = "../eid-testserver" }
tempfile = "3"
eid-engine = { path = ".", features = ["test-faults"] }
sha2 = "0.10"
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros", "time", "sync", "fs"] }

[target.'cfg(not(windows))'.dev-dependencies]
# TLS rejection/acceptance tests run where rustls is the backend (Linux); see ADR-0010
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
