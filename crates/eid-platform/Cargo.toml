[package]
name = "eid-platform"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "process", "rt", "sync", "signal"] }
getrandom = "0.2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync"] }

[lints]
workspace = true
