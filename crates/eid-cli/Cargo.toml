[package]
name = "eid-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "eid"
path = "src/main.rs"

[features]
# Crash injection for the integration tests only (never enabled in releases).
test-faults = ["eid-engine/test-faults"]
# Environment hooks for the video tests only (EID_TEST_MANIFEST, EID_TEST_TOOLS_BASE); never
# enabled in a release build.
test-hooks = []

[dependencies]
eid-engine = { path = "../eid-engine" }
eid-platform = { path = "../eid-platform" }
eid-ipc = { path = "../eid-ipc" }
eid-media = { path = "../eid-media" }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }

[dev-dependencies]
eid-testserver = { path = "../eid-testserver" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
sha2 = "0.10"
tempfile = "3"
eid-cli = { path = ".", features = ["test-faults", "test-hooks"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
eid-platform = { path = "../eid-platform" }
eid-engine = { path = "../eid-engine" }

[lints]
workspace = true
