[package]
name = "eid-media"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
eid-platform = { path = "../eid-platform" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
