[package]
name = "eid-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
eid-platform = { path = "../eid-platform" }
eid-engine = { path = "../eid-engine" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
# D5: deflate only (no zopfli, bzip2, lzma, zstd, aes, time)
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
eid-testserver = { path = "../eid-testserver" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
