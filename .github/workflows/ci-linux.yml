# Cheap, runs on every push/PR that touches code. (Private repo: Linux minutes cost 1x.)
name: ci-linux
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
permissions:
  contents: read
env:
  EID_REQUIRE_SHELLS: '1'   # shell-injection tests must not silently skip when pwsh/sh is missing
  CARGO_TERM_COLOR: always
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4          # TODO(P7): pin every action by commit SHA
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # the desktop app crate (eid-gui, Tauri 2) links against WebKitGTK on Linux; it is built
      # and unit tested here, its window only runs on Windows (ci-windows GUI smoke)
      # (gcc-mingw-w64: x86_64-w64-mingw32-windres and the gcc it preprocesses with, which
      # tauri-build needs to embed the
      # icon and manifest when the Windows-gnu compile check below builds eid-gui)
      - name: System libraries for the Tauri crate
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev gcc-mingw-w64-x86-64
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CPU count of this runner (context for the timing-sensitive socket tests)
        run: nproc
      - run: cargo test --workspace --no-fail-fast
      - name: "kernel-socket tests alone, one at a time (ADR-0011 - the sampler must not compete with other tests)"
        run: cargo test -p eid-engine --test g9_sockets -- --test-threads=1 --nocapture
      - run: python3 scripts/check_required.py
      - run: python3 scripts/check_required.py --release   # overflow/security tests in release mode
      - name: Windows target still compiles (compile-check only, never executed here)
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
      - name: cargo deny check (blocking, deny.toml; owner decision D10)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
  # Cheap checks without Rust: release scripts and the JS tests of the extension and of the
  # desktop UI (written on parallel v0.1 branches; each step runs only when such tests exist,
  # and fails if node found zero tests: no silent skip).
  scripts-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Release scripts (manifest generator, version check) unit tests
        run: python3 -m unittest discover -s scripts/windows -v
      - name: One version in Cargo.toml, Cargo.lock and tauri.conf.json
        run: python3 scripts/windows/check_version.py
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Extension JS tests (node --test, default test-file discovery inside extension/)
        if: ${{ hashFiles('extension/**/*.test.js', 'extension/**/*.test.mjs', 'extension/**/*.test.cjs', 'extension/**/*_test.js', 'extension/**/*-test.js', 'extension/**/test/**/*.js', 'extension/**/test/**/*.mjs') != '' }}
        working-directory: extension
        run: |
          node --test 2>&1 | tee "$RUNNER_TEMP/ext-tests.txt"
          test "${PIPESTATUS[0]}" -eq 0
          if grep -Eq '^(ℹ|#) tests 0$' "$RUNNER_TEMP/ext-tests.txt"; then echo "node found zero tests in extension/"; exit 1; fi
      - name: Desktop UI JS tests (node --test inside crates/eid-gui/ui)
        if: ${{ hashFiles('crates/eid-gui/ui/**/*.test.js', 'crates/eid-gui/ui/**/*.test.mjs', 'crates/eid-gui/ui/**/*.test.cjs', 'crates/eid-gui/ui/**/*_test.js', 'crates/eid-gui/ui/**/*-test.js', 'crates/eid-gui/ui/**/test/**/*.js', 'crates/eid-gui/ui/**/test/**/*.mjs') != '' }}
        working-directory: crates/eid-gui/ui
        run: |
          node --test 2>&1 | tee "$RUNNER_TEMP/ui-tests.txt"
          test "${PIPESTATUS[0]}" -eq 0
          if grep -Eq '^(ℹ|#) tests 0$' "$RUNNER_TEMP/ui-tests.txt"; then echo "node found zero tests in crates/eid-gui/ui/"; exit 1; fi
