# Cheap, runs on every push/PR that touches code. (Private repo: Linux minutes cost 1x.)
name: ci-linux
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
permissions:
  contents: read
env:
  EID_REQUIRE_SHELLS: '1'   # shell-injection tests must not silently skip when pwsh/sh is missing
  CARGO_TERM_COLOR: always
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4          # TODO(P7): pin every action by commit SHA
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # the desktop app crate (eid-gui, Tauri 2) links against WebKitGTK on Linux; it is built
      # and unit tested here, its window only runs on Windows (ci-windows GUI smoke)
      # (binutils-mingw-w64: x86_64-w64-mingw32-windres, which tauri-build needs to embed the
      # icon and manifest when the Windows-gnu compile check below builds eid-gui)
      - name: System libraries for the Tauri crate
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev binutils-mingw-w64-x86-64
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CPU count of this runner (context for the timing-sensitive socket tests)
        run: nproc
      - run: cargo test --workspace --no-fail-fast
      - name: "kernel-socket tests alone, one at a time (ADR-0011 - the sampler must not compete with other tests)"
        run: cargo test -p eid-engine --test g9_sockets -- --test-threads=1 --nocapture
      - run: python3 scripts/check_required.py
      - run: python3 scripts/check_required.py --release   # overflow/security tests in release mode
      - name: Windows target still compiles (compile-check only, never executed here)
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
      - name: cargo deny check (blocking, deny.toml; owner decision D10)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
