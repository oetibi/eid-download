# Expensive (Windows minutes count 2x on private repos): NOT on every push to every branch.
# Runs on pull_request, pushes to main (merge results, owner-approved 2026-11-13), version tags
# and manual dispatch.
name: ci-windows
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  workflow_dispatch:
permissions:
  contents: read
env:
  EID_REQUIRE_SHELLS: '1'   # shell-injection tests must not silently skip when pwsh/sh is missing
  CARGO_TERM_COLOR: always
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      # ---- P4 D3: ffprobe for fake_clip_has_video_and_audio_by_ffprobe, the SAME build and
      # hashes the product pins in tools/manifest.json (no other version, no PATH tool).
      - name: Read the pinned FFmpeg asset from tools/manifest.json
        id: ffm
        shell: pwsh
        run: |
          $m = Get-Content tools/manifest.json -Raw | ConvertFrom-Json
          $t = $m.tools | Where-Object { $_.name -eq 'ffmpeg' }
          $p = $t.files | Where-Object { $_.name -eq 'ffprobe.exe' }
          "url=$($t.url)" >> $env:GITHUB_OUTPUT
          "sha=$($t.sha256)" >> $env:GITHUB_OUTPUT
          "entry=$($p.entry)" >> $env:GITHUB_OUTPUT
          "probe_sha=$($p.sha256)" >> $env:GITHUB_OUTPUT
      - name: Cache the pinned FFmpeg asset (keyed by its SHA-256)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-pinned
          key: ffmpeg-${{ steps.ffm.outputs.sha }}
      - name: Download, verify and unpack ffprobe (fails on any hash mismatch)
        shell: pwsh
        env:
          FF_URL: ${{ steps.ffm.outputs.url }}
          FF_SHA: ${{ steps.ffm.outputs.sha }}
          FF_ENTRY: ${{ steps.ffm.outputs.entry }}
          FF_PROBE_SHA: ${{ steps.ffm.outputs.probe_sha }}
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'ffmpeg-pinned'
          New-Item -ItemType Directory -Force $d | Out-Null
          $zip = Join-Path $d 'ffmpeg.zip'
          if (-not (Test-Path $zip)) { Invoke-WebRequest -Uri $env:FF_URL -OutFile $zip }
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FF_SHA) { Remove-Item $zip; throw "FFmpeg asset SHA-256 $h != pinned $env:FF_SHA" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $e = $z.Entries | Where-Object { $_.FullName -eq $env:FF_ENTRY }
            if (-not $e) { throw "entry $env:FF_ENTRY not in the archive" }
            $out = Join-Path $d 'ffprobe.exe'
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, $out, $true)
          } finally { $z.Dispose() }
          $ph = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if ($ph -ne $env:FF_PROBE_SHA) { throw "ffprobe.exe SHA-256 $ph != pinned $env:FF_PROBE_SHA" }
          "ffprobe.exe verified: $ph"
          "EID_FFPROBE=$out" >> $env:GITHUB_ENV
          "EID_REQUIRE_FFPROBE=1" >> $env:GITHUB_ENV
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CPU count of this runner
        run: echo "NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"
      - run: cargo test --workspace --no-fail-fast
      - name: socket test binary alone, one at a time (kernel-socket tests print NOT TESTED here)
        run: cargo test -p eid-engine --test g9_sockets -- --test-threads=1 --nocapture
      - run: python scripts/check_required.py
      - name: PowerShell + cmd injection matrix (real Windows shells)
        run: cargo test -p eid-cli --test shell_injection -- --nocapture
        continue-on-error: false
        if: ${{ hashFiles('crates/eid-cli/tests/shell_injection.rs') != '' }}
      - run: cargo build --release -p eid-cli
      # P4 review m10: the shipped eid.exe must not contain the test hooks (EID_TEST_* from the
      # `test-hooks` feature, EID_FAULT* from `test-faults`). Positive control first: the test
      # build of eid.exe (built by `cargo test --workspace` above, with both features) must
      # contain them, otherwise the scan proves nothing.
      - name: Release eid.exe carries no test hooks
        shell: pwsh
        run: |
          function Markers($path) {
            $t = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($path))
            @('EID_TEST_MANIFEST', 'EID_TEST_TOOLS_BASE', 'EID_TEST_CANCEL_FILE', 'EID_TEST_PUBLISH_FAIL', 'EID_FAULT') | Where-Object { $t.Contains($_) }
          }
          $ctl = @(Markers 'target\debug\eid.exe')
          if ($ctl.Count -lt 5) { throw "positive control failed: the test build of eid.exe shows only [$($ctl -join ', ')]" }
          $bad = @(Markers 'target\release\eid.exe')
          # also any future hook: the prefixes themselves must not occur in the release binary
          $rel = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes('target\release\eid.exe'))
          $bad += @('EID_TEST_', 'EID_FAULT') | Where-Object { $rel.Contains($_) }
          if ($bad.Count -gt 0) { throw "release eid.exe contains test hooks: $($bad -join ', ')" }
          "release eid.exe: no test hook markers (control: test build has $($ctl.Count) of 5)"
      # ---- Desktop app (P5): build, end-to-end smoke on the real window, ZIP package, and
      # (v0.1) the NSIS installer made from these same tested binaries.
      - run: cargo build --release -p eid-gui -p eid-native-host -p eid-testserver
      - name: Release EidDownload.exe and eid-native-host.exe carry no test hooks
        shell: pwsh
        run: |
          foreach ($f in 'target\release\EidDownload.exe', 'target\release\eid-native-host.exe') {
            $t = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($f))
            $bad = @('EID_TEST_', 'EID_FAULT') | Where-Object { $t.Contains($_) }
            if ($bad.Count -gt 0) { throw "$f contains test hooks: $($bad -join ', ')" }
            "$f`: no test hook markers"
          }
      - name: GUI smoke (real window + engine + eid CLI + local test server, SHA-256, screenshots)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\gui_smoke.ps1 -Bin target\release -Out gui-smoke
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gui-smoke-screenshots
          retention-days: 14
          path: gui-smoke/*.png
          if-no-files-found: warn
      # MIT and Apache-2.0 require the license texts of the crates we ship next to the binaries;
      # MPL-2.0 requires telling the recipient where the source is. cargo-about writes both.
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about@0.9.3 }   # pinned; installed from its GitHub release, checksum verified
      - name: Third-party license notices (fails on any license not in about.toml)
        run: cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.html about.hbs
      # v0.2 (owner's Windows test: the extension could not be found or installed): the unpacked
      # extension (Chrome/Edge with the pinned id, Firefox) ships in the ZIP and the installer,
      # with INSTALL-BROWSER-EXTENSION.txt; the store/sideload packages go into the artifact
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Browser extension (unit tests, unpacked build, packages)
        shell: pwsh
        run: |
          Push-Location extension; node --test; $rc = $LASTEXITCODE; Pop-Location
          if ($rc -ne 0) { throw "extension tests failed" }
          node scripts/ext/build.mjs --out target\ext
          if ($LASTEXITCODE -ne 0) { throw "extension build failed" }
          node scripts/ext/package.mjs --out dist\ext
          if ($LASTEXITCODE -ne 0) { throw "extension packaging failed" }
          $m = Get-Content target\ext\chrome\manifest.json -Raw | ConvertFrom-Json
          if (-not $m.key) { throw "the unpacked Chrome/Edge build must keep the key (pinned id)" }
          $f = Get-Content target\ext\firefox\manifest.json -Raw | ConvertFrom-Json
          if ($f.browser_specific_settings.gecko.id -ne 'eid-download@eid-download') { throw "Firefox id" }
          Get-ChildItem dist\ext
      # v0.2 (owner's real-Windows report): the REAL window driven through its buttons over
      # WebView2's DevTools port: the app alone in Explorer's "inside the ZIP" folder (startup
      # bar, a real file with SHA-256, YouTube -> Video window with a working probe, web page
      # refused, toolbar Pause/Resume), then an extracted copy (Connect the browsers -> HKCU
      # keys -> its eid-native-host answers like a browser's, Disconnect). Local server only.
      - name: Window end-to-end (real WebView2 window, clicks, files, registry, native host)
        shell: pwsh
        run: |
          node scripts/windows/window_e2e.mjs --bin target\release --out window-e2e
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: window-e2e
          retention-days: 14
          path: window-e2e/*
          if-no-files-found: warn
      - name: Package EidDownload-windows-x64.zip
        shell: pwsh
        run: |
          $d = 'dist\EidDownload-windows-x64'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target\release\EidDownload.exe, target\release\eid.exe, target\release\eid-native-host.exe $d
          Copy-Item crates\eid-gui\INSTALL-BROWSER-EXTENSION.txt $d
          New-Item -ItemType Directory -Force "$d\browser-extension" | Out-Null
          Copy-Item -Recurse target\ext\chrome "$d\browser-extension\chrome-edge"
          Copy-Item -Recurse target\ext\firefox "$d\browser-extension\firefox"
          foreach ($p in 'EidDownload.exe', 'eid.exe', 'eid-native-host.exe', 'INSTALL-BROWSER-EXTENSION.txt', 'browser-extension\chrome-edge\manifest.json', 'browser-extension\firefox\manifest.json') {
            if (-not (Test-Path (Join-Path $d $p))) { throw "the ZIP would miss $p" }
          }
          Copy-Item crates\eid-gui\README-WINDOWS.txt "$d\README.txt"
          Copy-Item LICENSE "$d\LICENSE.txt"
          Copy-Item THIRD-PARTY-LICENSES.html $d
          $n = (Select-String -Path "$d\THIRD-PARTY-LICENSES.html" -Pattern 'crates.io/crates/').Count
          if ($n -lt 100) { throw "THIRD-PARTY-LICENSES.html lists only $n crates" }
          "THIRD-PARTY-LICENSES.html: $n crate entries"
          Compress-Archive -Path $d -DestinationPath dist\EidDownload-windows-x64.zip -Force
      # ---- v0.1: NSIS installer (ADR-0005). `cargo tauri bundle` packs the binaries built and
      # smoke-tested above (no recompile, --no-binary-patching), then the installer is verified
      # for real on this runner: silent per-user install, files, HKCU keys, app start, uninstall.
      - name: One version in Cargo.toml, Cargo.lock, tauri.conf.json (and the tag)
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { python scripts/windows/check_version.py --tag $env:GITHUB_REF_NAME } else { python scripts/windows/check_version.py }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: taiki-e/install-action@v2
        with: { tool: tauri-cli@2.12.6 }   # pinned, = the tauri crate version in Cargo.lock; prebuilt release binary
      - name: Build the NSIS installer (release mode on every build, refuses placeholder extension IDs)
        shell: pwsh
        run: |
          cargo tauri --version
          scripts\windows\build_installer.ps1 -Release   # every build: the release path is the one tested (refuses placeholder ids)
      - name: Verify the installer (silent install, files, HKCU Native Messaging keys, app start, silent uninstall, cleanup)
        shell: pwsh
        run: |
          $i = @(Get-ChildItem dist\EidDownload-*-windows-x64-setup.exe)
          if ($i.Count -ne 1) { throw "expected one installer in dist, found $($i.Count)" }
          scripts\windows\verify_installer.ps1 -Installer $i[0].FullName -Bin target\release
      # Measurement, not a gate: GitHub runner numbers (shared VM), labelled as such in the file.
      - name: Startup time and memory of EidDownload.exe (5 runs, runner numbers)
        shell: pwsh
        continue-on-error: true
        run: scripts\windows\perf_startup.ps1 -Bin target\release -Out perf-windows -Runs 5 -IdleSeconds 10
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: perf-windows
          retention-days: 30
          path: perf-windows/
          if-no-files-found: warn
      # Measurement of the download engine on Windows (eid only; the IDM side is an owner step,
      # docs/OWNER-ACTIONS.md). Every file is checked by SHA-256 against the server: a wrong file fails.
      - name: Engine speed on Windows (loopback, 64 MiB, 4 MiB/s per connection, runner numbers)
        shell: pwsh
        run: scripts\windows\compare_idm.ps1 -SkipIdm -Bin target\release -Out engine-windows -Size 67108864 -ThrottlePerConn 4194304 -Connections 1,8,16 -Runs 3
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: engine-windows
          retention-days: 30
          path: engine-windows/results.*
          if-no-files-found: warn
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist\EidDownload-*-windows-x64-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one installer in dist, found $($setup.Count)" }
          $files = 'target\release\EidDownload.exe', 'target\release\eid.exe', 'target\release\eid-native-host.exe', 'dist\EidDownload-windows-x64.zip', $setup[0].FullName
          $files | ForEach-Object { $h = Get-FileHash $_ -Algorithm SHA256; "$($h.Hash.ToLower())  $(Split-Path $_ -Leaf)" } | Tee-Object -FilePath SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eid-windows-x64
          retention-days: 14
          path: |
            dist/EidDownload-windows-x64.zip
            dist/EidDownload-*-windows-x64-setup.exe
            dist/ext/*.zip
            crates/eid-gui/INSTALL-BROWSER-EXTENSION.txt
            target/release/EidDownload.exe
            target/release/eid.exe
            target/release/eid-native-host.exe
            SHA256SUMS.txt
  # Releases are built by CI only (AGENTS §3.7): a `v*` tag runs the whole Windows job above
  # (tests, GUI smoke, package, installer build + verification) and only then publishes exactly
  # that job's artifact. The notes come from docs/releases/<tag>.md (must exist and carry the
  # "not tested by hand" section); the SHA-256 lines are appended from the artifact itself.
  # Release kind: a PRE-release by default. It is published as a full (latest) release only
  # when docs/releases/<tag>.md contains the exact line `release-kind: final` (the owner's
  # decision, made in the reviewed notes file; the line itself is not shown in the notes).
  #
  # DRY RUN: on every pull request, push to main and manual dispatch this job runs EVERY step
  # with the tag the next release would get (v<workspace version>) except `gh release create`;
  # it then checks that this tag is not taken yet and uploads what it would publish as the
  # artifact `release-dry-run`. A version is tagged only after a green dry run, so a release
  # step can no longer fail for the first time on a tag (v0.1.0 and v0.1.1 did).
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release tag (the pushed tag, or the one the next release would get)
        id: tag
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$ver"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "dry=false" >> "$GITHUB_OUTPUT"
            test "$GITHUB_REF_NAME" = "v$ver" || { echo "tag $GITHUB_REF_NAME != v$ver"; exit 1; }
          else
            echo "tag=v$ver" >> "$GITHUB_OUTPUT"; echo "dry=true" >> "$GITHUB_OUTPUT"
          fi
          echo "release tag: v$ver (dry run: $([[ "$GITHUB_REF" == refs/tags/v* ]] && echo no || echo yes))"
      - uses: actions/download-artifact@v4
        with: { name: eid-windows-x64, path: rel }
      - name: Check the artifact against its SHA256SUMS
        working-directory: rel
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cp dist/EidDownload-windows-x64.zip dist/EidDownload-*-windows-x64-setup.exe target/release/EidDownload.exe target/release/eid.exe target/release/eid-native-host.exe .
          # SHA256SUMS.txt is written on Windows (CRLF): normalise to LF so grep/sha256sum and the notes read it exactly
          sed -i 's/\r$//' SHA256SUMS.txt
          test "$(ls EidDownload-*-windows-x64-setup.exe | wc -l)" -eq 1
          test -f "EidDownload-${TAG#v}-windows-x64-setup.exe" || { echo "installer is not EidDownload-${TAG#v}-windows-x64-setup.exe"; ls; exit 1; }
          grep -q 'windows-x64-setup.exe$' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Browser extension packages (store + sideload), added to SHA256SUMS
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          (cd extension && node --test)
          node scripts/ext/package.mjs --out ext-pkg
          for t in chrome firefox chrome-sideload; do test -f "ext-pkg/eid-download-$t-${TAG#v}.zip" || { echo "missing eid-download-$t-${TAG#v}.zip"; ls ext-pkg; exit 1; }; done
          cp ext-pkg/*.zip rel/
          cat ext-pkg/SHA256SUMS.txt >> rel/SHA256SUMS.txt
          (cd rel && sha256sum -c SHA256SUMS.txt)
      - name: Release notes and kind
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          notes="docs/releases/$TAG.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          grep -q 'لم يُختبر يدوياً' "$notes" || { echo "$notes has no 'not tested by hand' section"; exit 1; }
          if grep -q '<<FILL>>' "$notes"; then echo "$notes still has <<FILL>> placeholders"; exit 1; fi
          if grep -qx 'release-kind: final' "$notes"; then echo "--latest" > kind.txt; else echo "--prerelease" > kind.txt; fi
          echo "release kind: $(cat kind.txt)"
          { grep -vx 'release-kind: final' "$notes"; printf '\n## SHA-256\n```\n'; cat rel/SHA256SUMS.txt; printf '```\n'; } > notes.md
          ls rel/EidDownload-windows-x64.zip rel/EidDownload-*-windows-x64-setup.exe rel/eid-download-*.zip rel/SHA256SUMS.txt
      - name: Dry run - the tag is still free, show what would be published
        if: ${{ steps.tag.outputs.dry == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1 > /dev/null   # the token can read releases
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::warning::tag $TAG already exists: bump the workspace version before the next release"
          fi
          echo "WOULD RUN: gh release create $TAG --repo $GITHUB_REPOSITORY $(cat kind.txt) --verify-tag --title \"Eid Download $TAG (Windows x64)\" --notes-file notes.md" rel/EidDownload-windows-x64.zip rel/EidDownload-*-windows-x64-setup.exe rel/eid-download-*.zip rel/SHA256SUMS.txt
          mkdir -p dry && cp notes.md kind.txt rel/SHA256SUMS.txt dry/
      - uses: actions/upload-artifact@v4
        if: ${{ steps.tag.outputs.dry == 'true' }}
        with:
          name: release-dry-run
          retention-days: 14
          path: dry/
      - name: Publish the GitHub release
        if: ${{ steps.tag.outputs.dry == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "$(cat kind.txt)" --verify-tag \
            --title "Eid Download $TAG (Windows x64)" --notes-file notes.md \
            rel/EidDownload-windows-x64.zip rel/EidDownload-*-windows-x64-setup.exe rel/eid-download-*.zip rel/SHA256SUMS.txt
      - name: Verify the published release (assets downloaded back, SHA-256, kind)
        if: ${{ steps.tag.outputs.dry == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir back && cd back
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum -c --ignore-missing SHA256SUMS.txt
          test "$(ls | wc -l)" -eq "$(( $(wc -l < SHA256SUMS.txt) - 3 + 1 ))"   # every zip/installer + SHA256SUMS (the 3 bare .exe are not assets)
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
          if [ "$(cat ../kind.txt)" = "--prerelease" ]; then test "$pre" = "true"; fi
          echo "published $TAG, prerelease=$pre, $(ls | wc -l) assets verified"
