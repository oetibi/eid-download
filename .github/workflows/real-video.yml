# REAL video test on Windows (owner request 2026-11-19: "test the real functions on Windows;
# mocks are not proof"). Manual only: real internet, real sites, ~230 MB of pinned tools.
# Two sources, the same test (crates/eid-cli/tests/real_jobs.rs):
#  - peertube: framatube.org (PeerTube; CC BY / CC BY-SA videos and a public playlist). Not
#    bot-checked, so it proves the real Windows pipeline: pinned tools install, probe, quality
#    choice, FFmpeg merge, audio-only, numbered playlist folder, pause/resume, skip-done.
#  - youtube: Blender's CC content. YouTube often bot-checks GitHub runner addresses; that
#    outcome is reported as such (continue-on-error), never hidden and never bypassed.
name: real-video
on:
  # a push to a `real-video/*` branch runs it too (workflow_dispatch needs the file on main)
  push:
    branches: ['real-video/**']
  workflow_dispatch:
    inputs:
      package_run:
        description: "ci-windows run id whose package (artifact eid-windows-x64) the 'window' job tests; empty = build from this commit"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  real:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source: [peertube, youtube]
    continue-on-error: ${{ matrix.source == 'youtube' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real yt-dlp / FFmpeg / Deno through the app's job layer (${{ matrix.source }})
        env:
          SOURCE: ${{ matrix.source }}
        shell: pwsh
        run: |
          if ($env:SOURCE -eq 'peertube') {
            # "What is PeerTube?" (Framasoft, CC BY-SA, 113 s, 240p..1080p)
            $env:EID_REAL_VIDEO = 'https://framatube.org/w/kkGMgK9ZtnKfYAgnEtQxbv'
            $env:EID_REAL_BEST_VIDEO = 'https://framatube.org/w/kkGMgK9ZtnKfYAgnEtQxbv'
            # FSFE "Youth Hacking 4 Freedom" playlist; items 4 (CC BY, 331 s) and 8 (CC BY-SA, 224 s)
            $env:EID_REAL_PLAYLIST = 'https://framatube.org/w/p/pQQ3gnRUKG6t3ptVy6iNP9'
            $env:EID_REAL_ITEMS = '4,8'
          }
          cargo test -p eid-cli --test real_jobs -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath real-video-$env:SOURCE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: real-video-${{ matrix.source }}-log
          retention-days: 30
          path: real-video-${{ matrix.source }}.log

  # v0.2 (owner's real-Windows report): the same real tools and a real PeerTube video, but from
  # the REAL window, started the way the owner started it (alone, from inside the ZIP folder):
  # agreement -> tools installed from the window -> probe -> 360p -> the file is saved.
  window:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # v0.2 (owner's report 2026-11-20): test THE package the owner downloads. With
      # `package_run`, the ci-windows artifact of that run is fetched, its ZIP checked against
      # its SHA256SUMS.txt, extracted, and the window test runs on those exact bytes.
      - uses: actions/download-artifact@v4
        if: ${{ inputs.package_run != '' }}
        with:
          name: eid-windows-x64
          path: pkg-artifact
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - run: cargo build --release -p eid-testserver
      - if: ${{ inputs.package_run == '' }}
        run: cargo build --release -p eid-gui -p eid-cli -p eid-native-host
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Window end-to-end with real tools and a real video (--online)
        shell: pwsh
        env:
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          if ($env:PACKAGE_RUN) {
            $zip = Get-ChildItem -Recurse pkg-artifact -Filter EidDownload-windows-x64.zip | Select-Object -First 1
            $sums = Get-ChildItem -Recurse pkg-artifact -Filter SHA256SUMS.txt | Select-Object -First 1
            $h = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
            $want = (Select-String -Path $sums.FullName -Pattern 'EidDownload-windows-x64.zip').Line.Split(' ')[0]
            "package of ci-windows run $env:PACKAGE_RUN: $($zip.Name) SHA-256 $h (SHA256SUMS: $want)"
            if ($h -ne $want) { throw "the ZIP does not match its SHA256SUMS" }
            $pkg = Join-Path $env:RUNNER_TEMP 'pkg'
            Expand-Archive $zip.FullName -DestinationPath $pkg
            $bin = Join-Path $pkg 'EidDownload-windows-x64'
          } else { $bin = 'target\release' }
          node scripts/windows/window_e2e.mjs --bin $bin --server target\release\eid-testserver.exe --out window-e2e --online 2>&1 | Tee-Object -FilePath window-e2e-online.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: window-e2e-online
          retention-days: 30
          path: |
            window-e2e/*
            window-e2e-online.log
